<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <div class="calc-number">
          <button onclick="">1</button>
        </div>
        <div class="calc-number">
          <button onclick="">2</button>
        </div>
        <div class="calc-number">
          <button onclick="">3</button>
        </div>
        <div class="calc-number">
          <button onclick="">4</button>
        </div>
        <div class="calc-number">
          <button onclick="">5</button>
        </div>
        <div class="calc-number">
          <button onclick="">6</button>
        </div>
        <div class="calc-number">
          <button onclick="">7</button>
        </div>
        <div class="calc-number">
          <button onclick="">8</button>
        </div>
        <div class="calc-number">
          <button onclick="">9</button>
        </div>
        <div class="calc-button">
          <button onclick="" id="add">+</button>
        </div>
        <div class="calc-button">
          <button onclick="" id="minus">-</button>
        </div>
        <div class="calc-button" id="multiply">
          <button onclick="">*</button>
        </div>
        <div class="calc-button" id =divide>
          <button onclick="">/</button>
        </div>
        <div class="calc-button" id="equals">
          <button onclick="">=</button>
        </div>
        <div class="calc-button" id="clear">
          <button onclick="">Clear</button>
        </div>
      </div>

   <script src="index.js"></script>
</body>
</html>
