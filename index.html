<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Calculator</title>
</head>
<body>
  <div class="container">
    <div class="output">Output</div>
    <button class="calc-button" type="button" id="clear" onclick="" value="C">C</button>
    <button class="calc-button operators" type="button" onclick="" value="+/-">+/-</button>
    <button class="calc-button operators" type="button" onclick="" value="%">%</button>
    <button class="calc-button operators" type="button" onclick="" value="/">/</button>
    <button class="calc-button" type="button" onclick="" value="7">7</button>
    <button class="calc-button" type="button" onclick="" value="8">8</button>
    <button class="calc-button" type="button" onclick="" value="9">9</button>
    <button class="calc-button operators" type="button" onclick="" value="*">*</button>
    <button class="calc-button" type="button" onclick="" value="4">4</button>
    <button class="calc-button" type="button" onclick="" value="5">5</button>
    <button class="calc-button" type="button" onclick="" value="6">6</button>
    <button class="calc-button operators" type="button" onclick="" value="-">-</button>
    <button class="calc-button" type="button" onclick="" value="1">1</button>
    <button class="calc-button" type="button" onclick="" value="2">2</button>
    <button class="calc-button" type="button" onclick="" value="3">3</button>
    <button class="calc-button operators" type="button" onclick="" value="+">+</button>
    <button class="calc-button zero" type="button" onclick="" value="0">0</button>
    <button class="calc-button" type="button" onclick="" value=".">.</button>
    <button class="calc-button" id="equals" type="button" onclick="" value="=">=</button>
  </div>

  <script src="index.js"></script>
</body>
</html>
